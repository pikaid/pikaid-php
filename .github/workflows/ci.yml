name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit and conformance (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, gmp, bcmath
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint every PHP file
        run: |
          find src tests benchmarks -name '*.php' -print | while IFS= read -r file; do
            php -l "$file" || exit 1
          done
      - name: PHPUnit (deprecations fail)
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --fail-on-deprecation
      - name: Standalone conformance
        run: php tests/verify.php
      - name: Pure PHP fallback conformance
        run: php -n tests/verify.php
      - name: Assert the pure PHP run really has no math extensions
        run: |
          php -n -r 'if (function_exists("gmp_import") || function_exists("bcadd")) { fwrite(STDERR, "GMP/BCMath unexpectedly available under php -n\n"); exit(1); } echo "GMP: no; BCMath: no\n";'

  coverage:
    name: Coverage gate (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, gmp, bcmath
          coverage: xdebug
          tools: composer:v2
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Measure path coverage
        run: |
          mkdir -p coverage
          php -d memory_limit=1G vendor/bin/phpunit --configuration phpunit.xml.dist --path-coverage --coverage-clover coverage/clover.xml
      - name: Enforce the coverage gate
        run: php tests/coverage_gate.php coverage/clover.xml 99 95 85

  legacy:
    name: Standalone conformance (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, bcmath
          coverage: none
      - name: Standalone conformance
        run: php tests/verify.php
      - name: Pure PHP fallback conformance
        run: php -n -d extension=json tests/verify.php
      - name: Backend parity probe
        run: php tests/backends.php
      - name: Backend parity probe without math extensions
        run: php -n -d extension=json tests/backends.php

  package:
    name: Packaging and external consumer
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter, gmp, bcmath
          coverage: none
          tools: composer:v2
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify runnable README examples
        run: php tests/readme_examples.php
      - name: Archive hygiene and installed-package consumer
        run: ./tests/consumer_smoke.sh
