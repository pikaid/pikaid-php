name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit and conformance (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, gmp, bcmath
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPUnit (deprecations fail)
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --fail-on-deprecation
      - name: Standalone conformance
        run: php tests/verify.php
      - name: Pure PHP fallback conformance
        run: php -n tests/verify.php

  legacy:
    name: Standalone conformance (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, bcmath
          coverage: none
      - name: Standalone conformance
        run: php tests/verify.php
      - name: Pure PHP fallback conformance
        run: php -n -d extension=json tests/verify.php
