name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHPUnit and conformance (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, gmp, bcmath
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint every PHP file
        run: |
          find src tests benchmarks -name '*.php' -print | while IFS= read -r file; do
            php -l "$file" || exit 1
          done
      - name: PHPUnit (deprecations fail)
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --fail-on-deprecation
      - name: Standalone conformance
        run: php tests/verify.php
      - name: Pure PHP fallback conformance
        run: php -n tests/verify.php
      - name: Assert the pure PHP run really has no math extensions
        run: |
          php -n -r 'if (function_exists("gmp_import") || function_exists("bcadd")) { fwrite(STDERR, "GMP/BCMath unexpectedly available under php -n\n"); exit(1); } echo "GMP: no; BCMath: no\n";'

  official-suite:
    name: Official shared suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check out the immutable pikaid-specs conformance suite
        uses: actions/checkout@v4
        with:
          repository: pikaid/pikaid-specs
          ref: 059780cc0e5b113443812720d95c630649bf3aa3
          path: .ai/official-suite/pikaid-specs
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, xmlwriter, gmp, bcmath
          coverage: none
      - name: Verify the suite checkout, checksums and independent oracle
        run: |
          set -euo pipefail
          SUITE="$GITHUB_WORKSPACE/.ai/official-suite/pikaid-specs/conformance"
          test "$(git -C "$GITHUB_WORKSPACE/.ai/official-suite/pikaid-specs" rev-parse HEAD)" = "059780cc0e5b113443812720d95c630649bf3aa3"
          (cd "$SUITE" && sha256sum -c SHA256SUMS)
          python3 -m venv "$RUNNER_TEMP/pikaid-suite-venv"
          "$RUNNER_TEMP/pikaid-suite-venv/bin/python" -m pip install --disable-pip-version-check jsonschema==4.26.0
          (cd "$SUITE" && "$RUNNER_TEMP/pikaid-suite-venv/bin/python" tools/verify_vectors.py --expect-status OFFICIAL --expect-package-revision 1.0.0 --expect-spec-revision 1.0.4)
          (cd "$SUITE" && "$RUNNER_TEMP/pikaid-suite-venv/bin/python" -m unittest discover -s tools/tests -v)
          (cd "$SUITE" && node tools/verify_oracle_node.mjs)
      - name: Official suite on the GMP backend
        env:
          PIKAID_EXPECT_BACKEND: gmp
        run: |
          set -euo pipefail
          SUITE="$GITHUB_WORKSPACE/.ai/official-suite/pikaid-specs/conformance"
          cd "$SUITE"
          "$RUNNER_TEMP/pikaid-suite-venv/bin/python" tools/run_adapter.py --automated-only \
            --report-json "$RUNNER_TEMP/official-${{ matrix.php }}-gmp.json" \
            -- php "$GITHUB_WORKSPACE/tests/official/adapter.php"
      - name: Official suite on the BCMath backend
        env:
          PIKAID_EXPECT_BACKEND: bcmath
        run: |
          set -euo pipefail
          SUITE="$GITHUB_WORKSPACE/.ai/official-suite/pikaid-specs/conformance"
          cd "$SUITE"
          "$RUNNER_TEMP/pikaid-suite-venv/bin/python" tools/run_adapter.py --automated-only \
            --report-json "$RUNNER_TEMP/official-${{ matrix.php }}-bcmath.json" \
            -- php -d disable_functions=gmp_import,gmp_export,gmp_init,gmp_strval \
            "$GITHUB_WORKSPACE/tests/official/adapter.php"
      - name: Official suite on the pure-PHP backend
        env:
          PIKAID_EXPECT_BACKEND: pure
        run: |
          set -euo pipefail
          SUITE="$GITHUB_WORKSPACE/.ai/official-suite/pikaid-specs/conformance"
          cd "$SUITE"
          "$RUNNER_TEMP/pikaid-suite-venv/bin/python" tools/run_adapter.py --automated-only \
            --report-json "$RUNNER_TEMP/official-${{ matrix.php }}-pure.json" \
            -- php -d disable_functions=gmp_import,gmp_export,gmp_init,gmp_strval,bcadd,bcmul,bccomp,bcmod,bcdiv \
            "$GITHUB_WORKSPACE/tests/official/adapter.php"
      - name: Upload official suite reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-suite-reports-php-${{ matrix.php }}
          path: ${{ runner.temp }}/official-*.json
          if-no-files-found: error

  coverage:
    name: Coverage gate (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, gmp, bcmath
          coverage: xdebug
          tools: composer:v2
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Measure path coverage
        run: |
          mkdir -p coverage
          php -d memory_limit=1G vendor/bin/phpunit --configuration phpunit.xml.dist --path-coverage --coverage-clover coverage/clover.xml
      - name: Enforce the coverage gate
        run: php tests/coverage_gate.php coverage/clover.xml 99 95 85

  legacy:
    name: Standalone conformance (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gmp, bcmath
          coverage: none
      - name: Standalone conformance
        run: php tests/verify.php
      - name: Pure PHP fallback conformance
        run: php -n -d extension=json tests/verify.php
      - name: Backend parity probe
        run: php tests/backends.php
      - name: Backend parity probe without math extensions
        run: php -n -d extension=json tests/backends.php

  package:
    name: Packaging and external consumer
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter, gmp, bcmath
          coverage: none
          tools: composer:v2
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify runnable README examples
        run: php tests/readme_examples.php
      - name: Archive hygiene and installed-package consumer
        run: ./tests/consumer_smoke.sh
